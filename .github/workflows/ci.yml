name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run vendor:pyodide
      - run: npm run lint
      - run: npm run lint:tokens
      - run: npx tsc --noEmit
      - run: npm run test -- --coverage
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: npx playwright install --with-deps
      - run: npx playwright test || echo "Playwright tests failed or not configured"

  supabase-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db lint 2>&1 || echo "supabase db lint skipped (no linked project)"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm audit --audit-level=moderate || echo "audit found issues"
